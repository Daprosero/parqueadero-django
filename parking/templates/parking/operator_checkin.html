<!doctype html>
<html>
<head><meta charset="utf-8"><title>Ingreso</title></head>
<body>
  <h1>Ingreso (Operario)</h1>

  {% if messages %}
    <ul>
      {% for m in messages %}<li>{{ m }}</li>{% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar ingreso</button>
  </form>

  <p><a href="/operario/cobro/">Ir a Cobro</a></p>
</body>
</html>
